-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="712" y="182" width="96" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="760" y="195" text-anchor="middle" font-size="12" fill="#496778">profile</text><polyline points="1060,136 1060,210 760,210 760,270" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="892" y="189" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="910" y="202" text-anchor="middle" font-size="12" fill="#496778">预留</text><polyline points="760,356 760,510" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="742" y="412" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="760" y="425" text-anchor="middle" font-size="12" fill="#496778">证据</text><polyline points="1060,136 1060,510" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="982" y="302" width="156" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="1060" y="315" text-anchor="middle" font-size="12" fill="#496778">unknown / 耗尽</text><polyline points="760,596 760,660 460,660 460,720" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="592" y="639" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="610" y="652" text-anchor="middle" font-size="12" fill="#496778">统计</text><polyline points="998.5714285714286,596 821.4285714285714,720" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="880" y="637" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="910" y="650" text-anchor="middle" font-size="12" fill="#496778">不能通过</text><polyline points="570,763 650,763" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-7-arrow)"/><rect x="562" y="742" width="96" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="610" y="755" text-anchor="middle" font-size="12" fill="#496778">真实运行后判定</text><g class="node" tabindex="0" role="button" aria-label="冻结 120 合成案例" data-node="dataset"><rect x="50" y="50" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="160" y="97" text-anchor="middle" font-size="16" fill="#1d4255">冻结 120 合成案例</text><title>business-synthetic-reference-v1；checksum 在真实请求前冻结；标签不是人工标注。</title></g><g class="node" tabindex="0" role="button" aria-label="40 development" data-node="dev"><rect x="350" y="50" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="460" y="97" text-anchor="middle" font-size="16" fill="#1d4255">40 development</text><title>真实采集40/40：26有效、14 invalid_response；所有失败原样保留，不由holdout拟合。</title></g><g class="node" tabindex="0" role="button" aria-label="兼容 profile / 逐请求校验" data-node="fit"><rect x="650" y="50" width="220" height="86" rx="10" fill="#e9dff5" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="86" text-anchor="middle" font-size="16" fill="#1d4255">兼容 profile</text><text x="760" y="108" text-anchor="middle" font-size="16" fill="#1d4255">逐请求校验</text><title>实际模型typesafe/jev-1.13-20260917。14条Score数值不一致使冻结v2禁用请求涉及的六类family；当前Jev快路线覆盖为零。</title></g><g class="node" tabindex="0" role="button" aria-label="80 holdout" data-node="hold"><rect x="50" y="270" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="160" y="317" text-anchor="middle" font-size="16" fill="#1d4255">80 holdout</text><title>48常见/16复杂/16边界；固定验收不用于拟合阈值。</title></g><g class="node" tabindex="0" role="button" aria-label="三策略 / 三轮交错" data-node="schedule"><rect x="350" y="270" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="460" y="306" text-anchor="middle" font-size="16" fill="#1d4255">三策略</text><text x="460" y="328" text-anchor="middle" font-size="16" fill="#1d4255">三轮交错</text><title>80×3×3=720；每轮旋转策略和案例顺序，串行重建相同初始资源。</title></g><g class="node" tabindex="0" role="button" aria-label="生产 Worker + Services + CLI" data-node="harness"><rect x="650" y="270" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="306" text-anchor="middle" font-size="16" fill="#1d4255">生产 Worker + Servi</text><text x="760" y="328" text-anchor="middle" font-size="16" fill="#1d4255">ces + CLI</text><title>三策略同源清单、Skill、目录、治理与初始资源；标签只用于评分。完整对照使用修复前源码；当前修复不能事后改分或冒充性能证明。</title></g><g class="node" tabindex="0" role="button" aria-label="累计 Jev $1 账本" data-node="ledger"><rect x="950" y="50" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="1060" y="97" text-anchor="middle" font-size="16" fill="#1d4255">累计 Jev $1 账本</text><title>累计已知$0.007450422，剩余$0.992549578、未知预留为零。两次无记录由拥有者对账；不重复记同一generation。</title></g><g class="node selected" tabindex="0" role="button" aria-label="回执 / usage / 机器耗时" data-node="proof"><rect x="650" y="510" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="535" text-anchor="middle" font-size="16" fill="#1d4255">回执</text><text x="760" y="557" text-anchor="middle" font-size="16" fill="#1d4255">usage</text><text x="760" y="579" text-anchor="middle" font-size="16" fill="#1d4255">机器耗时</text><title>business-outcome-2按目标动作、参数与最终状态评分，允许补充只读查询；完整720原证据不重算。修复后的W⊆C⊆O与拒绝响应记账使用单独回归、有限新案例验证。现版本另行9次真实探测（8次正确），全部用量完整、禁止写入0；不回填旧记录。</title></g><g class="node" tabindex="0" role="button" aria-label="历史部分 / 未知用量" data-node="partial"><rect x="950" y="510" width="220" height="86" rx="10" fill="#f7e8c9" stroke="#7e99a9" stroke-width="1.3"/><text x="1060" y="546" text-anchor="middle" font-size="16" fill="#1d4255">历史部分</text><text x="1060" y="568" text-anchor="middle" font-size="16" fill="#1d4255">未知用量</text><title>旧39条评分无效报告单独保留；完整720中7个trial未知用量不回填。千问已知调用按用户确认零费率结算，免费额度不证明tokens完整。</title></g><g class="node" tabindex="0" role="button" aria-label="完整真实验收四指标" data-node="gate"><rect x="350" y="720" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="460" y="767" text-anchor="middle" font-size="16" fill="#1d4255">完整真实验收四指标</text><title>四个效果条件均满足：hybrid准确率不低于main、禁止写入0、常见p50略低、总机器耗时不高；必要usage缺失仍使严格验收not_passed，不能只报效果条件。</title></g><g class="node" tabindex="0" role="button" aria-label="720 / 完整未通过" data-node="pending"><rect x="650" y="720" width="220" height="86" rx="10" fill="#f7e8c9" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="756" text-anchor="middle" font-size="16" fill="#1d4255">720</text><text x="760" y="778" text-anchor="middle" font-size="16" fill="#1d4255">完整未通过</text><title>每策略240次：rule正确120、main149、hybrid151。7个hybrid trial用量不完整，严格not_passed；禁止写入0。Jev六类判断禁用，没有Jev提效证明。旧39条独立保留，Linux待验收。</title></g></svg>