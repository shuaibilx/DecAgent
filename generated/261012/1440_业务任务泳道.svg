<svg viewBox="0 0 1240 970" xmlns="http://www.w3.org/2000/svg" id="diagram-2" role="group" aria-label="任务泳道" width="1240" height="970"><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif}.selected rect{stroke:#bf7e19;stroke-width:3.3}</style><rect width="1240" height="970" fill="#fff"/><defs><marker id="diagram-2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b8797"/></marker></defs><rect x="8" y="10" width="294" height="950" fill="#f7f9fa" rx="9"/><text x="155" y="46" text-anchor="middle" font-size="17" fill="#4d6f82">拥有者</text><rect x="318" y="10" width="294" height="950" fill="#f0f6f7" rx="9"/><text x="465" y="46" text-anchor="middle" font-size="17" fill="#4d6f82">持久控制</text><rect x="628" y="10" width="294" height="950" fill="#f7f9fa" rx="9"/><text x="775" y="46" text-anchor="middle" font-size="17" fill="#4d6f82">业务 Agent</text><rect x="938" y="10" width="294" height="950" fill="#f0f6f7" rx="9"/><text x="1085" y="46" text-anchor="middle" font-size="17" fill="#4d6f82">CLI / 业务事务</text><polyline points="250,128 340,128" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="277" y="107" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="295" y="120" text-anchor="middle" font-size="12" fill="#496778">提交</text><polyline points="560,128 650,128" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="587" y="107" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="605" y="120" text-anchor="middle" font-size="12" fill="#496778">领取</text><polyline points="760,171 760,275" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="730" y="202" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="760" y="215" text-anchor="middle" font-size="12" fill="#496778">复杂目标</text><polyline points="870,318 960,318" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="897" y="297" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="915" y="310" text-anchor="middle" font-size="12" fill="#496778">允许</text><polyline points="1070,361 1070,430 760,430 760,465" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="897" y="409" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="915" y="422" text-anchor="middle" font-size="12" fill="#496778">核实</text><polyline points="650,508 560,508" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="575" y="487" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="605" y="500" text-anchor="middle" font-size="12" fill="#496778">必要澄清</text><polyline points="340,508 250,508" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="265" y="487" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="295" y="500" text-anchor="middle" font-size="12" fill="#496778">具体问题</text><polyline points="140,551 140,620 760,620 760,655" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="420" y="599" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="450" y="612" text-anchor="middle" font-size="12" fill="#496778">认证回复</text><polyline points="760,551 760,655" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="730" y="582" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="760" y="595" text-anchor="middle" font-size="12" fill="#496778">对象明确</text><polyline points="870,698 960,698" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="897" y="677" width="36" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="915" y="690" text-anchor="middle" font-size="12" fill="#496778">执行</text><polyline points="1070,741 1070,888 560,888" fill="none" stroke="#6b8797" stroke-width="1.65" marker-end="url(#diagram-2-arrow)"/><rect x="785" y="867" width="60" height="18" fill="#fff" fill-opacity="0.94" rx="3"/><text x="815" y="880" text-anchor="middle" font-size="12" fill="#496778">目标核对</text><g class="node" tabindex="0" role="button" aria-label="创建并分派目标" data-node="u"><rect x="30" y="85" width="220" height="86" rx="10" fill="#f7e8c9" stroke="#7e99a9" stroke-width="1.3"/><text x="140" y="132" text-anchor="middle" font-size="16" fill="#1d4255">创建并分派目标</text><title>提供具体目标，必要时给部门或人员 ID。</title></g><g class="node" tabindex="0" role="button" aria-label="冻结任务 / 排队" data-node="api"><rect x="340" y="85" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="450" y="121" text-anchor="middle" font-size="16" fill="#1d4255">冻结任务</text><text x="450" y="143" text-anchor="middle" font-size="16" fill="#1d4255">排队</text><title>任务记录 scope、插件摘要、strategy、budget 和认证 provenance。</title></g><g class="node" tabindex="0" role="button" aria-label="读取真实目录" data-node="facts"><rect x="650" y="85" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="132" text-anchor="middle" font-size="16" fill="#1d4255">读取真实目录</text><title>重名保留 ID+name+team；不臆造人员或分类。</title></g><g class="node" tabindex="0" role="button" aria-label="创建提案 / 治理" data-node="create"><rect x="650" y="275" width="220" height="86" rx="10" fill="#dce8fa" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="311" text-anchor="middle" font-size="16" fill="#1d4255">创建提案</text><text x="760" y="333" text-anchor="middle" font-size="16" fill="#1d4255">治理</text><title>主模型复杂规划与快速判断都通过相同 Schema/授权规则。</title></g><g class="node" tabindex="0" role="button" aria-label="create / 同事务回执" data-node="write"><rect x="960" y="275" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="1070" y="311" text-anchor="middle" font-size="16" fill="#1d4255">create</text><text x="1070" y="333" text-anchor="middle" font-size="16" fill="#1d4255">同事务回执</text><title>工单创建、历史 revision 1、operation_receipt 在同一事务内。</title></g><g class="node" tabindex="0" role="button" aria-label="保留已核实创建结果" data-node="observe"><rect x="650" y="465" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="512" text-anchor="middle" font-size="16" fill="#1d4255">保留已核实创建结果</text><title>后续工具上下文保留完整结果、action ID 和 ticket ID。</title></g><g class="node selected" tabindex="0" role="button" aria-label="持久澄清 / checkpoint" data-node="question"><rect x="340" y="465" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="450" y="501" text-anchor="middle" font-size="16" fill="#1d4255">持久澄清</text><text x="450" y="523" text-anchor="middle" font-size="16" fill="#1d4255">checkpoint</text><title>缺少唯一人员时询问；回复只恢复当前绑定问题。</title></g><g class="node" tabindex="0" role="button" aria-label="补部门 / 准确 ID" data-node="answer"><rect x="30" y="465" width="220" height="86" rx="10" fill="#f7e8c9" stroke="#7e99a9" stroke-width="1.3"/><text x="140" y="501" text-anchor="middle" font-size="16" fill="#1d4255">补部门</text><text x="140" y="523" text-anchor="middle" font-size="16" fill="#1d4255">准确 ID</text><title>名字重复时只给姓名不足，应明确团队或人员 ID。</title></g><g class="node" tabindex="0" role="button" aria-label="分派提案 / 新鲜度校验" data-node="assign"><rect x="650" y="655" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="760" y="691" text-anchor="middle" font-size="16" fill="#1d4255">分派提案</text><text x="760" y="713" text-anchor="middle" font-size="16" fill="#1d4255">新鲜度校验</text><title>当前 ticket revision、活跃目录与请求意图仍要检查。</title></g><g class="node" tabindex="0" role="button" aria-label="assign / 回执核实" data-node="awrite"><rect x="960" y="655" width="220" height="86" rx="10" fill="#e8edf1" stroke="#7e99a9" stroke-width="1.3"/><text x="1070" y="691" text-anchor="middle" font-size="16" fill="#1d4255">assign</text><text x="1070" y="713" text-anchor="middle" font-size="16" fill="#1d4255">回执核实</text><title>首次明确分派可自动；改派需要具体确认，成功仍须 receipt+get。</title></g><g class="node" tabindex="0" role="button" aria-label="目标完成 / 结果展示" data-node="result"><rect x="340" y="845" width="220" height="86" rx="10" fill="#d0ebe7" stroke="#7e99a9" stroke-width="1.3"/><text x="450" y="881" text-anchor="middle" font-size="16" fill="#1d4255">目标完成</text><text x="450" y="903" text-anchor="middle" font-size="16" fill="#1d4255">结果展示</text><title>create+assign 两个成功动作指向同一工单，不能擅自解决或关闭。</title></g></svg>