name: Release image publishing and private CD trigger

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full CI release gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish versioned GHCR images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      control_digest: ${{ steps.control.outputs.digest }}
      executor_digest: ${{ steps.executor.outputs.digest }}
      runner_digest: ${{ steps.runner.outputs.digest }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a semantic version tag on main history
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish control image
        id: control
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-control:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-control:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-control
          cache-to: type=gha,mode=max,scope=decagent-control

      - name: Build and publish executor image
        id: executor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/executor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-executor:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-executor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-executor
          cache-to: type=gha,mode=max,scope=decagent-executor

      - name: Build and publish runner image
        id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-runner:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-runner:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-runner
          cache-to: type=gha,mode=max,scope=decagent-runner

  dispatch_private_deploy:
    name: Trigger trusted private deployment
    needs: publish
    if: needs.publish.result == 'success' && vars.DECAGENT_PRIVATE_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Create a single-repository Actions token
        id: private-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DECAGENT_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DECAGENT_DEPLOY_APP_PRIVATE_KEY }}
          owner: shuaibilx
          repositories: DecAgent-deploy
          permission-actions: write

      - name: Dispatch fixed private deployment workflow
        env:
          APP_TOKEN: ${{ steps.private-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_DIGEST: ${{ needs.publish.outputs.control_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          source = os.environ["SOURCE_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          run_id = os.environ["RELEASE_RUN_ID"]
          run_attempt = os.environ["RELEASE_RUN_ATTEMPT"]
          digest = os.environ["CONTROL_DIGEST"]
          token = os.environ["APP_TOKEN"]
          if source != "shuaibilx/DecAgent":
              raise SystemExit("Unexpected public release repository")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Unexpected release tag")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Unexpected release commit")
          if not re.fullmatch(r"[1-9][0-9]*", run_id) or not re.fullmatch(r"[1-9][0-9]*", run_attempt):
              raise SystemExit("Unexpected release run identity")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Published control-image digest is missing")

          payload = {
              "ref": "main",
              "inputs": {
                  "source_repository": source,
                  "tag": tag,
                  "sha": sha,
                  "run_id": run_id,
                  "run_attempt": run_attempt,
                  "image": f"ghcr.io/shuaibilx/decagent-control@{digest}",
              },
          }
          request = Request(
              "https://api.github.com/repos/shuaibilx/DecAgent-deploy/actions/workflows/deploy-sop.yml/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise SystemExit("Private deployment dispatch returned an unexpected status")
          except (HTTPError, URLError, TimeoutError) as exc:
              raise SystemExit("Private deployment workflow dispatch failed") from exc
          print(f"Dispatched {tag} at {sha} to the fixed private workflow.")
          PY
