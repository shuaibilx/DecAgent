name: Release and local deployment

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full CI release gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish versioned GHCR images
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      control_digest: ${{ steps.control.outputs.digest }}
      executor_digest: ${{ steps.executor.outputs.digest }}
      runner_digest: ${{ steps.runner.outputs.digest }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a semantic version tag on main history
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish control image
        id: control
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/control/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-control:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-control:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-control
          cache-to: type=gha,mode=max,scope=decagent-control

      - name: Build and publish executor image
        id: executor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/executor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-executor:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-executor:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-executor
          cache-to: type=gha,mode=max,scope=decagent-executor

      - name: Build and publish runner image
        id: runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ops/runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shuaibilx/decagent-runner:${{ github.ref_name }}
            ghcr.io/shuaibilx/decagent-runner:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=decagent-runner
          cache-to: type=gha,mode=max,scope=decagent-runner
