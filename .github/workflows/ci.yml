name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workbench-ui:
    name: Workbench JavaScript regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check workbench JavaScript syntax
        run: |
          node --version
          node --check decagent/gateway/static/business.js
          node --check evals/deterministic/business_selection.cjs
          node --check evals/deterministic/business_trace_rendering.cjs
          node --check evals/deterministic/business_semantic_workbench.cjs
          node --check evals/deterministic/guest_workbench.cjs

      - name: Run workbench UI behavior regressions
        run: |
          node evals/deterministic/business_selection.cjs
          node evals/deterministic/business_trace_rendering.cjs
          node evals/deterministic/business_semantic_workbench.cjs
          node evals/deterministic/guest_workbench.cjs

  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked project and development dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python style
        run: python -m ruff check decagent evals ops

      - name: Run deterministic tests
        run: python -m pytest evals/deterministic -q -rs

  integration:
    name: Python ${{ matrix.python-version }} integration shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ["3.11", "3.13"]
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: decagent_ci
          POSTGRES_USER: decagent
          POSTGRES_PASSWORD: decagent_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decagent -d decagent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DECAGENT_TEST_DATABASE_URL: postgresql://decagent:decagent_ci_only@127.0.0.1:5432/decagent_ci
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.txt
            pyproject.toml

      - name: Install locked project and development dependencies
        run: python -m pip install -r requirements.txt

      - name: Run database integration tests
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
        run: >-
          python -m pytest evals/integration -n 4 --dist=worksteal
          -p ops.testing.pytest_ci_shard
          --ci-shard-index $(($CI_SHARD_INDEX - 1))
          --ci-shard-count 3
          -q -rs --durations=25

  browser-e2e:
    name: Python 3.13 production gateway browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.0-noble@sha256:684df257a1fa0ef3fa288239819984008f560e8f8db5b635ee9e2a50cbcd2e23
      options: --ipc=host
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: decagent_ci
          POSTGRES_USER: decagent
          POSTGRES_PASSWORD: decagent_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decagent -d decagent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      DECAGENT_TEST_DATABASE_URL: postgresql://decagent:decagent_ci_only@postgres:5432/decagent_ci
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          # Avoid setup-python's pip-cache probe in the container image; the
          # Python installer itself succeeds, but that image lacks the pip shim.

      - name: Install locked application and browser-test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r evals/e2e/requirements.lock

      - name: Verify locked Playwright matches the preinstalled browser image
        run: python -m playwright --version

      - name: Run synthetic production gateway lifecycle in Chromium
        run: python -m evals.e2e.business_workbench

  executor-boundary:
    name: Disposable Docker executor and repair boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run real Docker and SQL boundary tests
        run: python ops/executor/run_docker_boundary_tests.py

  package-and-images:
    name: Build package and container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: decagent_ci
          POSTGRES_USER: decagent
          POSTGRES_PASSWORD: decagent_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decagent -d decagent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DECAGENT_TEST_DATABASE_URL: postgresql://decagent:decagent_ci_only@127.0.0.1:5432/decagent_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked project and build tool
        run: |
          python -m pip install -r requirements.txt
          python -m pip install build==1.6.1

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir "${RUNNER_TEMP}/dist"

      - name: Import the built wheel outside the source checkout
        run: |
          python -m pip install --no-deps --target "${RUNNER_TEMP}/wheel-site" "${RUNNER_TEMP}"/dist/*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/wheel-site" python -c 'import os; from pathlib import Path; import decagent; site = Path(os.environ["PYTHONPATH"]).resolve(); package = Path(decagent.__file__).resolve(); assert package.is_relative_to(site), package; print(package)'
          PYTHONPATH="${RUNNER_TEMP}/wheel-site" python -m decagent --help

      - name: Exercise installed-wheel MCP protocol with a disposable database
        run: python ops/mcp/verify_wheel.py --package-root "${RUNNER_TEMP}/wheel-site"

      - name: Build isolated runner image for offline Compose smoke test
        run: docker build -f ops/runner/Dockerfile -t decagent-executor-runner:supervised .

      - name: Run isolated offline Compose startup smoke test
        run: python ops/control/offline_smoke.py
