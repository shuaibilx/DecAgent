# Template for DecAgent-deploy/.github/workflows/deploy-sop.yml.
# Keep the verifier, Compose file, and rollout coordinator in the private
# deployment repository. Never check out or execute code from the public release.
name: Deploy reviewed DecAgent image

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Fixed public source repository
        required: true
        type: string
      tag:
        description: Semantic version tag
        required: true
        type: string
      sha:
        description: 40-character release commit SHA
        required: true
        type: string
      run_id:
        description: Successful public release workflow run ID
        required: true
        type: string
      run_attempt:
        description: Successful public release workflow attempt
        required: true
        type: string
      image:
        description: Fixed control image by immutable digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: decagent-sop-local-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: decagent-local-production
    runs-on: [self-hosted, Windows, X64, decagent-deploy]
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out only protected deployment code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify local SOP persistent configuration
        run: |
          $ErrorActionPreference = 'Stop'
          $localProjectDirectory = $env:DECAGENT_LOCAL_PROJECT_DIR
          if ([string]::IsNullOrWhiteSpace($localProjectDirectory)) {
            throw 'The Runner has no configured local SOP project directory.'
          }
          $localProjectDirectory = (Resolve-Path -LiteralPath $localProjectDirectory).Path
          $runtimePython = Join-Path $localProjectDirectory '.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $runtimePython -PathType Leaf)) {
            throw 'The local project Python 3.11+ runtime is missing.'
          }
          & $runtimePython -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'
          if ($LASTEXITCODE -ne 0) {
            throw 'The local project Python runtime must be version 3.11 or newer.'
          }
          $envFile = Join-Path $localProjectDirectory 'ops\deploy\sop.env'
          $secretsDirectory = Join-Path $localProjectDirectory '.decagent\sop-secrets'
          if (-not (Test-Path -LiteralPath $envFile -PathType Leaf)) {
            throw 'The local SOP environment file is missing.'
          }
          foreach ($name in @('postgres_password', 'main_api_key', 'jev_api_key')) {
            if (-not (Test-Path -LiteralPath (Join-Path $secretsDirectory $name) -PathType Leaf)) {
              throw 'A required local SOP secret file is missing.'
            }
          }

      - name: Verify public release provenance and immutable image digest
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          $localProjectDirectory = (Resolve-Path -LiteralPath $env:DECAGENT_LOCAL_PROJECT_DIR).Path
          $runtimePython = Join-Path $localProjectDirectory '.venv\Scripts\python.exe'
          & $runtimePython .\ops\deploy\release_verifier.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Roll out the verified digest through the fixed coordinator
        env:
          VERIFIED_IMAGE: ${{ steps.verify.outputs.image }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VERIFIED_IMAGE -notmatch '^ghcr\.io/shuaibilx/decagent-control@sha256:[0-9a-f]{64}$') {
            throw 'Verifier did not produce the fixed immutable control image.'
          }
          $localProjectDirectory = (Resolve-Path -LiteralPath $env:DECAGENT_LOCAL_PROJECT_DIR).Path
          $composeFile = Join-Path $PWD 'compose.sop.yaml'
          $envFile = Join-Path $localProjectDirectory 'ops\deploy\sop.env'
          $backupRoot = Join-Path $localProjectDirectory '.decagent\sop-backups'
          $stateRoot = Join-Path $localProjectDirectory '.decagent\sop-releases'
          $runtimePython = Join-Path $localProjectDirectory '.venv\Scripts\python.exe'
          & $runtimePython -m ops.deploy.sop_rollout `
            --candidate-image $env:VERIFIED_IMAGE `
            --project-directory $localProjectDirectory `
            --compose-file $composeFile `
            --env-file $envFile `
            --backup-root $backupRoot `
            --state-root $stateRoot `
            --run-id "gha-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
