# Disposable evaluator override. No production volumes, credentials, or service names are reused.
services:
  postgres:
    container_name: "${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-pg"
    networks:
      control:
        aliases:
          - decagent-executor-pg
  egress-proxy:
    container_name: "${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-proxy"
  executor-broker:
    container_name: "${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-broker"
    environment:
      DECAGENT_PROXY_CONTAINER: "${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-proxy"
      DECAGENT_CONTROL_CONTAINERS: "${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-pg,${DECAGENT_INSTANCE_PREFIX:-decagent-executor-compose}-broker"
    volumes:
      - .:/workspace:ro
secrets:
  broker_token:
    file: ${DECAGENT_EXECUTOR_TEST_SECRETS_DIR:?Set dedicated evaluator secret directory}/broker_token
  postgres_password:
    file: ${DECAGENT_EXECUTOR_TEST_SECRETS_DIR:?Set dedicated evaluator secret directory}/postgres_password
